name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Real ClamAV for the scanner adapter test; signatures load in a few minutes.
      clamd:
        image: clamav/clamav-debian:1.4
        ports: ["3310:3310"]
        options: >-
          --health-cmd "clamdcheck.sh" --health-interval 20s --health-start-period 300s --health-retries 20
    env:
      CLAMD_TEST_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Testcontainers uses the runner's Docker daemon: real Postgres, MinIO.
      - run: pnpm test:int

  e2e:
    # The walking skeleton through the real stack: Caddy, web x2, worker, Postgres, S3, Mailpit, ClamAV.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ocop/e2e exec playwright install --with-deps chromium
      - run: docker compose up -d --build --wait --wait-timeout 600 web worker caddy
      - run: pnpm --filter @ocop/e2e e2e
        env:
          CI: "true"
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            compose.log
      - if: always()
        run: docker compose down -v
