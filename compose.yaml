# Production-shaped stack for local runs (spec #1, Q19): the managed services of staging/prod
# are replaced by postgres, an S3 server (RustFS) and mailpit. `docker compose up` works without a .env file.
name: ocop

x-app-env: &app-env
  DATABASE_URL: postgres://ocop_app:${OCOP_APP_PASSWORD:-app-dev}@postgres:5432/ocop
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  TOTP_REQUIRED: ${TOTP_REQUIRED:-true}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-ZGV2LW9ubHktdG90cC1rZXktMzItYnl0ZXMtbG9uZyE=}
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: ${MAIL_FROM:-OCOP <no-reply@ocop.local>}
  S3_ENDPOINT: http://s3:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ocop}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ocop-dev-secret}
  S3_FORCE_PATH_STYLE: "true"
  S3_CORS_ORIGINS: ${APP_BASE_URL:-http://localhost:8080}
  CLAMD_HOST: clamd
  CLAMD_PORT: "3310"
  GOTENBERG_URL: http://gotenberg:3000
  GOTENBERG_TIMEOUT_SECONDS: "60"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ocop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
      OCOP_MIGRATOR_PASSWORD: ${OCOP_MIGRATOR_PASSWORD:-migrator-dev}
      OCOP_APP_PASSWORD: ${OCOP_APP_PASSWORD:-app-dev}
      OCOP_READONLY_PASSWORD: ${OCOP_READONLY_PASSWORD:-readonly-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./packages/infra/sql:/ocop-sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocop"]
      interval: 5s
      retries: 20

  # MinIO no longer publishes community images; RustFS speaks the same S3 API and env vars.
  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-ocop}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-ocop-dev-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health || curl -fs http://127.0.0.1:9000/health"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  clamd:
    image: clamav/clamav-debian:1.4
    environment:
      # Files up to FILE_MAX_MB (100 MB) must be scanned whole, not truncated at clamd's 25 MB default.
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxScanSize: 110M
      CLAMD_CONF_MaxFileSize: 110M
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      start_period: 300s
      retries: 10

  # DOCX → PDF (#81). Internal only: no published port. The client gives up after GOTENBERG_TIMEOUT_SECONDS,
  # a little after Gotenberg's own --api-timeout; --api-body-limit matches the client's 20 MB DOCX limit.
  gotenberg:
    image: gotenberg/gotenberg:8.39.0
    command:
      - gotenberg
      - --api-timeout=50s
      - --api-body-limit=20MB
      - --libreoffice-max-queue-size=10
      - --libreoffice-restart-after=10
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:3000/health"]
      interval: 10s
      start_period: 30s
      retries: 10

  migrate:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: migrate }
    environment:
      MIGRATOR_DATABASE_URL: postgres://ocop_migrator:${OCOP_MIGRATOR_PASSWORD:-migrator-dev}@postgres:5432/ocop
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: web }
    environment: *app-env
    deploy:
      replicas: 2
    depends_on:
      migrate: { condition: service_completed_successfully }
      gotenberg: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: worker }
    environment:
      <<: *app-env
      S3_AUTO_CREATE_BUCKETS: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }
      # Every upload goes through the scan, and every email through SMTP.
      clamd: { condition: service_healthy }
      mailpit: { condition: service_started }
      gotenberg: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - web

volumes:
  pgdata:
  s3data:
