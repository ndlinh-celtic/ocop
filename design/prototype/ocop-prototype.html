<title>OCOP Tỉnh Mẫu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Bố cục: thanh bên xanh rừng thu gọn được + vùng nội dung bo góc, thẻ trắng, khung hai bên cho màn chấm điểm.
   Màu: xanh lá tươi làm chủ đạo, vàng lúa cho sao/hạng, nền xanh bạc hà rất nhạt. */
:root {
  --bg: #EAF2EC;
  --bg-deco: #DCEBDF;
  --surface: #FFFFFF;
  --surface-2: #F4F9F5;
  --surface-3: #EBF3ED;
  --line: #DFE9E2;
  --line-strong: #C9D9CE;
  --text: #0F2A1B;
  --text-2: #4A6354;
  --text-3: #7D9485;
  --brand: #1C8C4A;
  --brand-hover: #167640;
  --brand-ink: #FFFFFF;
  --brand-soft: #E3F4E9;
  --brand-deep: #1F5C3A;
  --leaf: #7CC242;
  --amber: #E0A526;
  --amber-soft: #FCF1D6;
  --side: #0D2A1B;
  --side-2: #153A27;
  --side-3: #1E4A33;
  --side-text: #B9D0C0;
  --side-strong: #FFFFFF;
  --c-gray: #6B7C71;
  --c-blue: #2C6BD6;
  --c-orange: #DB741A;
  --c-red: #D2423A;
  --c-purple: #7656D6;
  --c-green: #1C8C4A;
  --c-amber: #C98E0E;
  --c-teal: #13897F;
  --shadow-1: 0 1px 2px rgba(16, 52, 32, .06), 0 2px 8px rgba(16, 52, 32, .05);
  --shadow-2: 0 10px 30px rgba(12, 48, 28, .14), 0 2px 6px rgba(12, 48, 28, .06);
  --overlay: rgba(9, 28, 18, .42);
  --hero-a: #178046;
  --hero-b: #2FAE63;
  --hero-c: #8CCB3F;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 26px;
  --font: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: "Be Vietnam Pro", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08130D; --bg-deco: #0D1D14; --surface: #102019; --surface-2: #142820; --surface-3: #1A3127;
    --line: #213A2D; --line-strong: #2C4A3A; --text: #E3F0E7; --text-2: #A7BEAF; --text-3: #7C9686;
    --brand: #35B96C; --brand-hover: #49C77D; --brand-ink: #062012; --brand-soft: #173B28; --brand-deep: #7FD6A1;
    --leaf: #9AD65E; --amber: #F0BC45; --amber-soft: #3A2E10;
    --side: #050E09; --side-2: #0E2218; --side-3: #163324; --side-text: #A3BCAB; --side-strong: #FFFFFF;
    --c-gray: #9AAAA0; --c-blue: #6E9DF0; --c-orange: #F09A4E; --c-red: #F07A70; --c-purple: #A48BF0; --c-green: #4CC47F; --c-amber: #EBB940; --c-teal: #45C2B5;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 12px 30px rgba(0,0,0,.5); --overlay: rgba(0,0,0,.6);
    --hero-a: #0F5E33; --hero-b: #1C8C4A; --hero-c: #5E9B25;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08130D; --bg-deco: #0D1D14; --surface: #102019; --surface-2: #142820; --surface-3: #1A3127;
  --line: #213A2D; --line-strong: #2C4A3A; --text: #E3F0E7; --text-2: #A7BEAF; --text-3: #7C9686;
  --brand: #35B96C; --brand-hover: #49C77D; --brand-ink: #062012; --brand-soft: #173B28; --brand-deep: #7FD6A1;
  --leaf: #9AD65E; --amber: #F0BC45; --amber-soft: #3A2E10;
  --side: #050E09; --side-2: #0E2218; --side-3: #163324; --side-text: #A3BCAB; --side-strong: #FFFFFF;
  --c-gray: #9AAAA0; --c-blue: #6E9DF0; --c-orange: #F09A4E; --c-red: #F07A70; --c-purple: #A48BF0; --c-green: #4CC47F; --c-amber: #EBB940; --c-teal: #45C2B5;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 12px 30px rgba(0,0,0,.5); --overlay: rgba(0,0,0,.6);
  --hero-a: #0F5E33; --hero-b: #1C8C4A; --hero-c: #5E9B25;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; font-weight: 650; }
h1 { font-size: 24px; letter-spacing: -.01em; }
h2 { font-size: 19px; }
h3 { font-size: 16px; }
h4 { font-size: 14px; }
p { margin: 0; }
.num, table, .tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.strong { font-weight: 600; }
.nowrap { white-space: nowrap; }
.ic { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: -3px; stroke-width: 1.9; }
.ic svg { width: 100%; height: 100%; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ===== Khung ứng dụng ===== */
.app { position: relative; height: 100%; display: flex; overflow: hidden; }
.app.phone-frame { width: 400px; max-width: 100%; height: min(860px, 100%); margin: 0 auto; border-radius: 34px; border: 8px solid var(--side); box-shadow: var(--shadow-2); }
.page-wrap { height: 100%; display: flex; align-items: center; background: radial-gradient(1200px 600px at 80% -10%, var(--bg-deco), transparent 60%), var(--bg); }
.side {
  width: 272px; flex: none; background: var(--side); color: var(--side-text);
  display: flex; flex-direction: column; position: relative; z-index: 5;
  transition: width .2s ease;
}
.side-head { display: flex; align-items: center; gap: 10px; padding: 26px 22px 22px; }
.logo-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(140deg, var(--leaf), #1C8C4A); color: #fff; flex: none; }
.logo-mark .ic { width: 22px; height: 22px; }
.logo-text { color: var(--side-strong); font-weight: 700; font-size: 17px; line-height: 1.1; }
.logo-text small { display: block; font-weight: 500; font-size: 11.5px; color: var(--side-text); letter-spacing: .02em; margin-top: 3px; }
.side-toggle {
  position: absolute; right: -15px; top: 32px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--side); border: 3px solid var(--surface); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0;
}
.side-toggle .ic { width: 15px; height: 15px; }
.side-scroll { flex: 1; overflow-y: auto; padding: 4px 14px 14px; scrollbar-width: thin; scrollbar-color: var(--side-3) transparent; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6F8E7A; padding: 18px 12px 8px; }
.nav-item {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 12px; border-radius: 14px;
  color: var(--side-text); background: none; border: 0; text-align: left; cursor: pointer; font-size: 14.5px; min-height: 44px;
}
.nav-item:hover { background: var(--side-2); color: #fff; text-decoration: none; }
.nav-item .ic { width: 20px; height: 20px; }
.nav-item.active { background: var(--side-2); color: #fff; font-weight: 600; }
.nav-item.active .nav-ico { background: var(--brand); color: #fff; }
.nav-ico { width: 34px; height: 34px; margin: -6px 0 -6px -4px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.nav-item .badge-n { margin-left: auto; }
.nav-sub { padding: 2px 0 6px 48px; display: grid; gap: 2px; }
.nav-sub a { color: var(--side-text); font-size: 13.5px; padding: 7px 10px; border-radius: 10px; }
.nav-sub a.active, .nav-sub a:hover { color: #fff; text-decoration: none; background: rgba(255,255,255,.04); }
.side-foot { padding: 14px; border-top: 1px solid var(--side-2); }
.user-card { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; color: #fff; }
.user-card .who { min-width: 0; flex: 1; }
.user-card .who b { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-card .who span { font-size: 12.5px; color: var(--side-text); }
.app.collapsed .side { width: 84px; }
.app.collapsed .logo-text, .app.collapsed .nav-text, .app.collapsed .nav-label, .app.collapsed .nav-sub, .app.collapsed .user-card .who, .app.collapsed .badge-n, .app.collapsed .user-card .ic { display: none; }
.app.collapsed .nav-item { justify-content: center; padding: 11px 0; }
.app.collapsed .nav-ico { margin: -6px 0; }
.app.collapsed .side-head { justify-content: center; padding-inline: 0; }
.app.collapsed .side-toggle .ic { transform: rotate(180deg); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); position: relative; }
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 18px 28px 14px 36px; flex-wrap: wrap;
}
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); min-width: 0; flex: 1; flex-wrap: wrap; }
.crumbs a { color: var(--text-2); }
.crumbs .sep { color: var(--text-3); }
.crumbs .ic { width: 14px; height: 14px; }
.crumbs b { color: var(--text); font-weight: 550; }
.code-tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); border: 1px dashed var(--line-strong); letter-spacing: .02em; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.search-trigger { white-space: nowrap; overflow: hidden;
  display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; width: 260px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text-3); cursor: pointer;
}
.search-trigger kbd { margin-left: auto; }
kbd { font: 600 11px/1 var(--font); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text-2); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: var(--surface); border: 1px solid var(--line); cursor: pointer; color: var(--text); padding: 0; flex: none;
}
.icon-btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--c-red); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--surface); }
.role-btn {
  display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 6px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); cursor: pointer; font-size: 14px; max-width: 280px;
}
.role-btn .role-dot { width: 32px; height: 32px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.role-btn span.lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sys-banner { margin: 0 28px 4px 36px; padding: 10px 16px; border-radius: 14px; background: var(--amber-soft); color: var(--text); display: flex; gap: 10px; align-items: center; font-size: 14px; }
.sys-banner .ic { color: var(--c-amber); }
.sys-banner .x { margin-left: auto; background: none; border: 0; cursor: pointer; color: var(--text-2); padding: 4px; }
.content {
  flex: 1; overflow-y: auto; overflow-x: hidden; container-type: inline-size; container-name: main;
  padding: 10px 28px 32px 36px; scroll-behavior: smooth;
}
.content-inner { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Thanh di động */
.mtop { display: none; }
.bottom-nav { display: none; }
.app.is-mobile .side { position: absolute; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .22s ease; width: 290px; z-index: 40; }
.app.is-mobile.side-open .side { transform: none; box-shadow: var(--shadow-2); }
.app.is-mobile .side-toggle { display: none; }
.app.is-mobile .topbar { display: none; }
.app.is-mobile .sys-banner { margin: 8px 12px 0; }
.app.is-mobile .mtop {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--side); color: #fff;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
}
.app.is-mobile .mtop .icon-btn { background: var(--side-2); border-color: var(--side-3); color: #fff; width: 42px; height: 42px; }
.app.is-mobile .mtop .icon-btn .dot { border-color: var(--side-2); }
.app.is-mobile .mtop .logo-text { font-size: 15px; flex: 1; }
.app.is-mobile .content { padding: 12px 14px 24px; }
.app.is-mobile .bottom-nav {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px 6px max(6px, env(safe-area-inset-bottom, 0px));
}
.bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--text-2); padding: 6px 2px; min-height: 52px; border-radius: 12px; text-align: center; line-height: 1.2; }
.bottom-nav a.active { color: var(--brand); font-weight: 600; }
.bottom-nav a.active .ic { background: var(--brand-soft); border-radius: 999px; width: 44px; padding: 2px 12px; height: 26px; }
.bottom-nav a:hover { text-decoration: none; }
.side-scrim { display: none; }
.app.is-mobile.side-open .side-scrim { display: block; position: absolute; inset: 0; background: var(--overlay); z-index: 39; }
.crumbs-m { display: none; }
.app.is-mobile .crumbs-m { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }

/* ===== Thẻ và lưới ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 24px; min-width: 0; }
.card.tight { padding: 18px; }
.card.flush { padding: 0; overflow: hidden; }
.card.dashed { border-style: dashed; border-color: var(--line-strong); background: var(--surface-2); }
.card.raised { box-shadow: var(--shadow-2); border-color: transparent; }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.card-head h2, .card-head h3 { display: flex; align-items: center; gap: 8px; }
.card-head .spacer, .spacer { flex: 1; }
.card-head .info { color: var(--text-3); }
.card-foot { margin: 20px -24px -24px; padding: 14px 24px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 20px; min-width: 0; }
.grid > * { min-width: 0; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); align-items: start; }
.g-side { grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); align-items: start; }
.g-3col { grid-template-columns: minmax(240px, 300px) minmax(0, 1fr) minmax(240px, 300px); align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stack.s8 { gap: 8px; }
.stack.s12 { gap: 12px; }
.stack.s24 { gap: 24px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.row.s8 { gap: 8px; }
.row.nowrap { flex-wrap: nowrap; }
.row.between { justify-content: space-between; }
.row.top { align-items: flex-start; }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }
.sticky-top { position: sticky; top: 0; z-index: 3; }
@container main (max-width: 1100px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3col { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .g-3col > :last-child { grid-column: 1 / -1; }
}
@container main (max-width: 900px) {
  .g-main, .g-side, .g-3 { grid-template-columns: minmax(0, 1fr); }
}
@container main (max-width: 640px) {
  .g-2, .g-3col { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 18px; border-radius: var(--r-lg); }
  .card-foot { margin: 16px -18px -18px; padding: 12px 18px; }
  h1 { font-size: 21px; }
  .content-inner { gap: 14px; }
  .grid { gap: 14px; }
  .hide-m { display: none !important; }
  body, .content { font-size: 16px; }
}
@container main (min-width: 641px) { .only-m { display: none !important; } }

/* ===== Đầu trang của màn ===== */
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head .t { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 6px; }
.page-head .t p { color: var(--text-2); }
.page-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }

.hero {
  position: relative; overflow: hidden; border-radius: var(--r-xl); color: #fff; padding: 28px 30px;
  background: radial-gradient(420px 260px at 32% 120%, rgba(255,255,255,.18), transparent 70%), linear-gradient(120deg, var(--hero-a), var(--hero-b) 58%, var(--hero-c));
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; min-height: 200px;
}
.hero::after { content: ""; position: absolute; width: 380px; height: 380px; border-radius: 50%; right: -120px; top: -160px; background: radial-gradient(circle, rgba(255,255,255,.16), transparent 65%); pointer-events: none; }
.hero h1, .hero h2 { color: #fff; }
.hero .hero-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; position: relative; z-index: 1; }
.hero .hero-meta { margin-top: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; align-items: center; color: rgba(255,255,255,.92); }
.hero .hero-side { display: flex; flex-direction: column; gap: 8px; min-width: 230px; position: relative; z-index: 1; }
.hero-pill { display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.28); font-size: 14px; color: #fff; }
.hero-pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.hero-tag { display: inline-flex; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.55); font-size: 13px; color: #fff; }
.hero .chip { background: rgba(255,255,255,.95); }
@container main (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); padding: 22px; } .hero .hero-side { min-width: 0; } }

/* ===== Nút ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px;
  font-weight: 600; font-size: 14.5px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); white-space: nowrap;
  text-decoration: none !important; transition: background .12s, border-color .12s, transform .05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-hover); }
.btn.soft { background: var(--brand-soft); border-color: transparent; color: var(--brand-deep); }
.btn.ghost { background: none; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--text); }
.btn.danger { background: var(--c-red); border-color: var(--c-red); color: #fff; }
.btn.danger-ghost { background: none; color: var(--c-red); border-color: color-mix(in srgb, var(--c-red) 40%, transparent); }
.btn.amber { background: var(--amber); border-color: var(--amber); color: #2A1E00; }
.btn.sm { min-height: 36px; padding: 0 13px; font-size: 13.5px; }
.btn.lg { min-height: 52px; padding: 0 24px; font-size: 16px; }
.btn.block { width: 100%; }
.btn[disabled], .btn.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn .ic { width: 17px; height: 17px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.link-btn:hover { text-decoration: underline; }
.fab { position: sticky; bottom: 16px; margin-left: auto; z-index: 4; box-shadow: var(--shadow-2); }

/* ===== Chip, huy hiệu ===== */
.chip {
  --t: var(--c-gray);
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; line-height: 1.5;
  background: color-mix(in srgb, var(--t) 13%, var(--surface)); color: color-mix(in srgb, var(--t) 78%, var(--text)); white-space: nowrap;
  border: 1px solid color-mix(in srgb, var(--t) 22%, transparent);
}
.chip .ic { width: 13px; height: 13px; stroke-width: 2.3; }
.chip.plain { padding-left: 10px; }
.t-gray { --t: var(--c-gray); } .t-blue { --t: var(--c-blue); } .t-orange { --t: var(--c-orange); } .t-red { --t: var(--c-red); }
.t-purple { --t: var(--c-purple); } .t-green { --t: var(--c-green); } .t-amber { --t: var(--c-amber); } .t-teal { --t: var(--c-teal); }
.badge-n { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--c-red); color: #fff; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
.badge-n.soft { background: var(--surface-3); color: var(--text-2); }
.tag { display: inline-flex; padding: 2px 9px; border-radius: 8px; font-size: 12.5px; background: var(--surface-3); color: var(--text-2); border: 1px solid var(--line); white-space: nowrap; }
.role-tag { font-size: 12px; padding: 1px 8px; border-radius: 6px; font-weight: 600; }
.stars { display: inline-flex; gap: 2px; color: var(--amber); vertical-align: -2px; }
.stars .ic { width: 16px; height: 16px; }
.stars .ic.full svg { fill: currentColor; }
.stars .ic.off { color: var(--line-strong); }
.stars.lg .ic { width: 28px; height: 28px; }
.stars.xl .ic { width: 40px; height: 40px; }

/* Huy hiệu nguồn dữ liệu phiếu chấm (3.5) */
.src-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 8px; white-space: nowrap; }
.src-ttv { background: var(--surface-3); color: var(--text-2); border: 1px solid var(--line); }
.src-edit { background: color-mix(in srgb, var(--c-orange) 15%, var(--surface)); color: color-mix(in srgb, var(--c-orange) 80%, var(--text)); border: 1px solid color-mix(in srgb, var(--c-orange) 35%, transparent); }
.src-badge .ic { width: 13px; height: 13px; }

/* ===== Biểu mẫu ===== */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 13.5px; font-weight: 600; color: var(--text); }
.field .req { color: var(--c-red); margin-left: 2px; }
.field .hint { font-size: 12.5px; color: var(--text-3); }
.field .err { font-size: 12.5px; color: var(--c-red); display: flex; gap: 6px; align-items: center; }
.field .err .ic { width: 14px; height: 14px; }
.input, .select, .textarea {
  width: 100%; min-height: 46px; border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 14px; background: var(--surface); color: var(--text);
}
.textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.input.invalid, .textarea.invalid, .select.invalid { border-color: var(--c-red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-red) 15%, transparent); }
.input[readonly], .input[disabled], .textarea[readonly], .select[disabled] { background: var(--surface-2); color: var(--text-2); }
.input-icon { position: relative; }
.input-icon .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.input-icon .input { padding-left: 42px; }
.input-icon .suffix { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.form-grid .full { grid-column: 1 / -1; }
@container main (max-width: 640px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 14.5px; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); margin: 1px 0 0; flex: none; }
.radio-cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.radio-card { border: 1.5px solid var(--line-strong); border-radius: 14px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; background: var(--surface); min-height: 48px; }
.radio-card input { accent-color: var(--brand); width: 18px; height: 18px; margin: 0; }
.radio-card:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--text-2); min-height: 36px; display: inline-flex; gap: 6px; align-items: center; }
.seg button.on { background: var(--surface); color: var(--brand-deep); box-shadow: var(--shadow-1); }
.seg.choice button.on.ok { background: var(--c-green); color: #fff; }
.seg.choice button.on.bad { background: var(--c-red); color: #fff; }
.seg.choice button.on.warn { background: var(--c-orange); color: #fff; }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 13px; background: var(--line-strong); transition: background .15s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + span { background: var(--brand); }
.switch input:checked + span::after { transform: translateX(18px); }
.pw-meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pw-meter i { height: 5px; border-radius: 3px; background: var(--line); }
.pw-meter i.on { background: var(--c-green); }

/* Ô nhập điểm (3.4) */
.score { display: inline-flex; align-items: center; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface); overflow: hidden; height: 44px; }
.score button { width: 36px; height: 100%; border: 0; background: var(--surface-2); cursor: pointer; color: var(--text-2); display: grid; place-items: center; padding: 0; }
.score button:hover { background: var(--surface-3); color: var(--text); }
.score button .ic { width: 15px; height: 15px; }
.score input { width: 44px; border: 0; text-align: right; font-weight: 700; font-size: 16px; padding: 0 2px; background: none; -moz-appearance: textfield; appearance: textfield; }
.score input::-webkit-inner-spin-button { -webkit-appearance: none; }
.score input:focus { outline: none; }
.score .max { padding: 0 10px 0 2px; color: var(--text-3); font-size: 14px; white-space: nowrap; }
.score:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.score.invalid { border-color: var(--c-red); }
.score.edited { border-color: var(--c-orange); }
.score.locked { opacity: .75; }
.orig { text-decoration: line-through; color: var(--text-3); font-size: 13px; }

/* OTP */
.otp { display: flex; gap: 8px; }
.otp input { width: 48px; height: 56px; text-align: center; font-size: 22px; font-weight: 700; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface); }
.otp input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.otp.invalid input { border-color: var(--c-red); }
@container main (max-width: 400px) { .otp input { width: 40px; height: 50px; } }

/* ===== Tabs và lọc ===== */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tabs .tab {
  border: 0; background: none; padding: 10px 18px; border-radius: 999px; font-weight: 500; color: var(--text-2); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; min-height: 44px;
}
.tabs .tab:hover { color: var(--text); background: var(--surface-3); }
.tabs .tab.on { background: var(--brand-soft); color: var(--brand-deep); font-weight: 600; }
.tabs.line { border-bottom: 1px solid var(--line); gap: 2px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.tabs.line .tab { border-radius: 0; padding: 12px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs.line .tab.on { background: none; border-bottom-color: var(--brand); color: var(--brand-deep); }
.tab-panel[hidden] { display: none; }
.fchips { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--text-2); display: inline-flex; gap: 8px; align-items: center; min-height: 38px; }
.fchip .n { font-size: 12px; font-weight: 700; color: var(--text-3); }
.fchip.on { background: var(--text); border-color: var(--text); color: var(--surface); }
.fchip.on .n { color: var(--surface); opacity: .75; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar .input-icon { flex: 1; min-width: 200px; max-width: 360px; }

/* ===== Bảng dữ liệu (3.6) ===== */
.tbl-wrap { overflow-x: auto; border-radius: 0 0 var(--r-xl) var(--r-xl); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.tbl th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--text-3); padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.tbl th.sort { cursor: pointer; }
.tbl th.sort .ic { width: 13px; height: 13px; margin-left: 4px; }
.tbl td { padding: 13px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background .1s; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tbody tr.sel { background: var(--brand-soft); }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl .r { text-align: right; }
.tbl .c { text-align: center; }
.tbl input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand); }
.tbl .prod { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.tbl .prod b { font-weight: 600; display: block; }
.tbl .prod small { color: var(--text-3); font-size: 12.5px; }
.tbl-cards { display: none; }
@container main (max-width: 640px) {
  .tbl-wrap.cardable { display: none; }
  .tbl-cards { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
}
.mcard { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.mcard .row { gap: 8px; }
.bulkbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--side); color: #fff; border-radius: 16px; flex-wrap: wrap; }
.bulkbar .btn { background: var(--side-2); border-color: var(--side-3); color: #fff; }
.bulkbar .btn.primary { background: var(--brand); border-color: var(--brand); }
.pager { display: flex; align-items: center; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--text-2); flex-wrap: wrap; }
.pager .pg { min-width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.pager .pg.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 700; }
.mat td, .mat th { text-align: center; }
.mat td:first-child, .mat th:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 2; }
.mat th:first-child { background: var(--surface-2); z-index: 3; }
.cell-ok { color: var(--c-green); } .cell-warn { color: var(--c-orange); } .cell-bad { color: var(--c-red); }
.cell-diff { background: color-mix(in srgb, var(--c-orange) 14%, transparent) !important; }
.cell-gap { background: color-mix(in srgb, var(--c-red) 12%, transparent) !important; }
.part-row td { background: var(--surface-3); font-weight: 650; }
.total-row td { background: var(--brand-soft); font-weight: 700; }

/* ===== Số liệu, biểu đồ ===== */
.stat { display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.stat .top { display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 13.5px; }
.stat .ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--t, var(--c-green)) 14%, var(--surface)); color: var(--t, var(--c-green)); flex: none; }
.stat .v { font-size: 30px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 13px; color: var(--text-3); }
.stat.link { cursor: pointer; text-decoration: none; color: inherit; }
.stat.link:hover { border-color: var(--line-strong); box-shadow: var(--shadow-1); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); margin: 20px -24px -24px; }
.kpis > div { padding: 18px 24px; }
.kpis b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpis span { font-size: 13px; color: var(--text-2); }
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end; gap: 8px; position: relative; padding-left: 30px; }
.bars .axis { position: absolute; left: 0; top: 0; bottom: 26px; width: 100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.bars .axis span { font-size: 12px; color: var(--text-3); line-height: 1; transform: translateY(-50%); }
.bars .axis span:last-child { transform: translateY(50%); }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; position: relative; cursor: default; }
.bar { width: 100%; max-width: 30px; border-radius: 999px; background: color-mix(in srgb, var(--brand) 26%, var(--surface)); min-height: 10px; transition: background .15s; }
.bar-col:hover .bar, .bar-col.hl .bar { background: var(--brand); }
.bar-col.hl .bar { position: relative; }
.bar-col.hl .bar::before { content: ""; position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; transform: translateX(-50%); border-radius: 50%; background: var(--brand); border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--brand); }
.bar-col .bl { font-size: 12px; color: var(--text-3); height: 18px; white-space: nowrap; }
.bar-tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--side); color: #fff; border-radius: 12px; padding: 8px 12px; font-size: 12.5px; white-space: nowrap; display: none; z-index: 5; box-shadow: var(--shadow-2); }
.bar-tip div { display: flex; justify-content: space-between; gap: 18px; }
.bar-tip div span { color: var(--side-text); }
.bar-col:hover .bar-tip, .bar-col.hl .bar-tip { display: block; }
.bars:hover .bar-col.hl:not(:hover) .bar-tip { display: none; }
.hbar { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) 52px; gap: 12px; align-items: center; font-size: 13.5px; }
.hbar .track { height: 12px; background: var(--surface-3); border-radius: 6px; overflow: hidden; display: flex; }
.hbar .track i { display: block; height: 100%; background: var(--brand); }
.hbar .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.progress { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 4px; background: var(--t, var(--brand)); }
.progress.lg { height: 12px; border-radius: 6px; }
.segbar { display: inline-flex; gap: 2px; align-items: center; }
.segbar i { width: 5px; height: 16px; border-radius: 2px; background: var(--line-strong); }
.segbar i.on { background: var(--t, var(--amber)); }
.funnel { display: flex; flex-direction: column; gap: 6px; }
.funnel .fs { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 44px; gap: 12px; align-items: center; font-size: 13.5px; }
.funnel .fs .track { display: flex; justify-content: center; }
.funnel .fs .track i { display: block; height: 30px; border-radius: 9px; background: linear-gradient(90deg, var(--hero-b), var(--leaf)); }
.funnel .fs b { text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.ring { --p: 50; --t: var(--brand); width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(var(--t) calc(var(--p) * 1%), var(--surface-3) 0); display: grid; place-items: center; flex: none; }
.ring > div { width: 92px; height: 92px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring b { font-size: 26px; font-weight: 700; }
.ring span { font-size: 12px; color: var(--text-3); }

/* ===== Danh sách, người ===== */
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; color: #fff; background: var(--av, var(--brand)); letter-spacing: .02em; }
.avatar.sm { width: 30px; height: 30px; font-size: 11.5px; }
.avatar.lg { width: 56px; height: 56px; font-size: 18px; }
.person { display: flex; align-items: center; gap: 12px; min-width: 0; }
.person .pn { min-width: 0; }
.person .pn b { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.person .pn span { font-size: 13px; color: var(--text-2); }
.list { display: flex; flex-direction: column; }
.list > .li { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.list > .li:last-child { border-bottom: 0; }
.list > .li.clickable { cursor: pointer; }
.list > .li .grow { flex: 1; min-width: 0; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
.kv > div { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.kv .ic { color: var(--text-3); margin-top: 2px; }
.kv dt, .kv .k { font-size: 12.5px; color: var(--text-3); }
.kv dd, .kv .v { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.kv.one { grid-template-columns: minmax(0, 1fr); }
@container main (max-width: 640px) { .kv { grid-template-columns: minmax(0, 1fr); } }
.dl { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr); gap: 10px 18px; font-size: 14.5px; }
.dl dt { color: var(--text-2); }
.dl dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
@container main (max-width: 520px) { .dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } .dl dd { margin-bottom: 10px; } }

/* Dòng thời gian trạng thái (3.3) */
.stepper { display: flex; align-items: flex-start; gap: 0; }
.stepper .st { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; text-align: center; cursor: pointer; padding: 0 4px; min-width: 0; }
.stepper .st::before { content: ""; position: absolute; top: 17px; right: 50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
.stepper .st:first-child::before { display: none; }
.stepper .st.done::before, .stepper .st.cur::before { background: var(--brand); }
.stepper .dotc { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--text-3); border: 2px solid var(--line); position: relative; z-index: 1; font-weight: 700; font-size: 14px; }
.stepper .st.done .dotc { background: var(--brand); border-color: var(--brand); color: #fff; }
.stepper .st.cur .dotc { background: var(--surface); border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 5px color-mix(in srgb, var(--brand) 18%, transparent); }
.stepper .st b { font-size: 14px; font-weight: 600; }
.stepper .st.todo b { color: var(--text-3); font-weight: 500; }
.stepper .st small { font-size: 12px; color: var(--text-3); }
.stepper .dotc .ic { width: 17px; height: 17px; stroke-width: 2.6; }
@container main (max-width: 640px) {
  .stepper { flex-direction: column; gap: 0; }
  .stepper .st { flex-direction: row; text-align: left; align-items: center; gap: 12px; padding: 8px 0; }
  .stepper .st::before { top: auto; bottom: 50%; right: auto; left: 17px; width: 3px; height: 100%; }
  .stepper .st .stx { display: flex; flex-direction: column; }
}
.wizard { display: flex; gap: 8px; flex-wrap: wrap; counter-reset: wz; }
.wizard .ws { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; color: var(--text-2); cursor: pointer; }
.wizard .ws .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); font-weight: 700; font-size: 13px; }
.wizard .ws.done .n { background: var(--brand); color: #fff; }
.wizard .ws.cur { border-color: var(--brand); color: var(--text); font-weight: 600; background: var(--brand-soft); }

          <details><summary class="small strong" style="cursor:pointer;color:var(--brand)">Cách đánh giá</summary><p class="small muted" style="margin-top:6px">Đánh giá dựa trên hồ sơ chứng minh và kiểm tra thực tế. Mức tối đa khi có đầy đủ minh chứng hợp lệ, còn hiệu lực.</p></details>
          <div><div class="label" style="margin-bottom:6px">Minh chứng yêu cầu</div><ul class="small muted" style="margin:0;padding-left:20px"><li>Hợp đồng, hóa đơn hoặc giấy tờ chứng minh</li><li>Ảnh chụp thực tế (nếu có)</li></ul></div>
          ${files.map((f) => O.file(f, { remove: true })).join('')}
          ${O.drop('Kéo thả tệp cho tiêu chí ' + t.code, 'PDF, JPG, PNG, DOCX. Tối đa 20 MB. Một tệp có thể gắn nhiều tiêu chí.', true)}
          <div class="field"><label for="gt-${t.code}">Giải trình</label><textarea class="textarea" id="gt-${t.code}" style="min-height:72px" placeholder="Giải thích thêm nếu minh chứng chưa thể hiện đủ">${i === 1 ? 'Hợp đồng thu mua với 12 hộ, kèm danh sách hộ và sản lượng năm 2025.' : ''}</textarea></div>
        </div></div>`;
      };
      let i = 0;
      return `${draftHead(1)}
        ${O.card(`<div class="stack s12"><div class="row between"><b>${shown} / ${D.tieuchi.length} tiêu chí đã có minh chứng</b><span class="small muted">${D.dot.phienBan}</span></div>${O.progress(shown, D.tieuchi.length, '', 'lg')}<p class="small muted">Tiêu chí thiếu minh chứng vẫn cho đi tiếp nhưng sẽ được đánh dấu ở bước nộp.</p></div>`, { cls: 'tight' })}
        ${D.parts.map((p) => `<section><div class="part-head"><h3>${p.name}</h3><span class="tag">Tối đa ${p.max} điểm</span></div>${D.tieuchi.filter((t) => t.part === p.id).map((t) => crit(t, i++)).join('')}</section>`).join('')}
        ${wzBar('s13', 's15')}`;
    },
  });

  /* ================= S15 Tự chấm điểm thử ================= */
  O.screen('s15', {
    title: 'Tự chấm điểm thử', code: 'S15', roles: ['chuthe'], device: 'Di động', crumbs: CRUMB_DRAFT,
    variants: [['partial', 'Chưa chấm hết'], ['full', 'Đã chấm đủ'], ['low', 'Dưới 50 điểm']],
    render({ variant: v }) {
      const val = (t, i) => (v === 'partial' ? (i > 13 ? '' : t.ttv) : v === 'low' ? Math.max(0, Math.round(t.ttv * 0.55)) : t.ttv);
      const list = D.parts.map((p) => `<section class="stack s8"><div class="part-head"><h3>${p.name}</h3><span class="pt" data-pt="${p.id}">0 / ${p.max}</span></div>${D.tieuchi.map((t, i) => [t, i]).filter(([t]) => t.part === p.id).map(([t, i]) => `<div class="crit"><div class="crit-head" style="cursor:default"><span class="crit-code">${t.code}</span><span class="crit-name">${esc(t.name)}${t.ev === 0 ? `<br>${O.tag('Chưa có minh chứng', 'orange', 'circle-alert')}` : ''}</span>${O.scoreInput({ id: 'sc-' + t.code, value: val(t, i), max: t.max, label: t.code + ' ' + t.name })}</div></div>`).join('')}</section>`).join('');
      const res = `<section class="card raised ct-res stack" id="s15-res"><div class="row between"><h2>Kết quả ước lượng</h2><span id="s15-tmp"></span></div>
        <div class="row" style="align-items:flex-end"><div class="ct-big"><span id="s15-total">0</span><small> / 100</small></div><div id="s15-stars"></div></div>
        <div class="stack s12">${D.parts.map((p) => `<div class="ct-part"><span>${p.name.replace(/^Phần (\w)\. /, 'Phần $1: ')}</span><b class="num" data-ps="${p.id}">0 / ${p.max}</b><div class="progress" data-pb="${p.id}"><i style="width:0"></i></div></div>`).join('')}</div>
        <div id="s15-warn"></div>
        <p class="small faint ct-fl" style="gap:8px;align-items:flex-start">${ic('info')}<span>Điểm tự chấm chỉ mang tính tham khảo, không phải kết quả chính thức.</span></p></section>`;
      return `${draftHead(2)}<div class="grid g-main ct-swap"><div class="stack s24">${list}</div>${res}</div>${wzBar('s14', 's16')}`;
    },
    mount(root) {
      const upd = () => {
        let filled = 0;
        const s = O.sumParts((t) => { const x = root.querySelector('#sc-' + t.code).value; if (x !== '') filled++; return x; });
        root.querySelector('#s15-total').textContent = s.T;
        D.parts.forEach((p) => { root.querySelector(`[data-ps="${p.id}"]`).textContent = `${s[p.id]} / ${p.max}`; root.querySelector(`[data-pt="${p.id}"]`).textContent = `${s[p.id]} / ${p.max}`; root.querySelector(`[data-pb="${p.id}"] i`).style.width = (s[p.id] / p.max) * 100 + '%'; });
        const r = O.rank(s.T);
        root.querySelector('#s15-stars').innerHTML = r ? `<div class="stack s8" style="gap:2px">${O.stars(r, 5, 'lg')}<span class="small strong">Ước lượng ${r} sao</span></div>` : `<span class="small strong" style="color:var(--c-red)">Chưa đạt</span>`;
        const incomplete = filled < D.tieuchi.length;
        root.querySelector('#s15-tmp').innerHTML = incomplete ? O.tag(`Ước lượng tạm thời · ${filled}/${D.tieuchi.length}`, 'orange', 'hourglass') : O.tag('Đã chấm đủ', 'green', 'circle-check');
        root.querySelector('#s15-warn').innerHTML = s.T < 50 && !incomplete ? O.banner({ tone: 'red', icon: 'circle-alert', title: 'Chưa đạt ngưỡng 3 sao (50 điểm)', text: 'Quay lại bổ sung minh chứng cho các tiêu chí còn thấp để cải thiện điểm.', actions: O.btn('Bổ sung minh chứng', { size: 'sm', go: 's14' }) }) : '';
        O.bind(root.querySelector('#s15-warn'));
      };
      root.addEventListener('input', (e) => { if (e.target.closest('[data-score]')) upd(); });
      upd();
    },
  });

  /* ================= S16 Xem lại và nộp ================= */
  O.screen('s16', {
    title: 'Xem lại và nộp', code: 'S16', roles: ['chuthe'], device: 'Di động', crumbs: CRUMB_DRAFT,
    variants: [['default', 'Chỉ có cảnh báo'], ['block', 'Có lỗi chặn'], ['closed', 'Đợt đã đóng'], ['done', 'Nộp thành công']],
    render({ variant: v }) {
      if (v === 'done') return `<div class="card raised" style="max-width:620px;margin:20px auto;width:100%"><div class="stack" style="align-items:center;text-align:center;gap:14px"><div class="big-ok">${ic('circle-check')}</div><h1>Đã nộp hồ sơ</h1><p class="muted">Hồ sơ <b>Khô cá lóc đồng</b> đã được chốt phiên bản và gửi tới UBND Xã An Phú.</p><div class="tag" style="font-size:16px;padding:8px 16px">Mã hồ sơ: <b style="margin-left:6px">HS-2026-0132</b></div></div>
        <hr class="divider" style="margin:20px 0"><h3 style="margin-bottom:12px">Bước tiếp theo</h3>${O.timeline([['landmark', 'blue', 'UBND xã tiếp nhận và kiểm tra', 'Thường trong 5 đến 7 ngày làm việc'], ['file-pen-line', 'orange', 'Nếu cần bổ sung, bạn sẽ nhận thông báo', 'Kèm danh sách mục và hạn bổ sung'], ['send', 'green', 'Xã gửi hồ sơ đạt sơ bộ lên tỉnh', `Trước hạn ${D.dot.hanXa}`]])}
        <div class="stack s8" style="margin-top:8px">${O.btn('Xem hồ sơ', { kind: 'primary lg', icon: 'eye', go: 's17', attrs: 'style="width:100%"' })}${O.btn('Về trang chủ', { kind: 'ghost', go: 's10', attrs: 'style="width:100%"' })}</div></div>`;
      const block = v === 'block', closed = v === 'closed';
      const chk = [
        ['ok', 'Đủ các trường bắt buộc', 'Thông tin chung đã nhập đầy đủ.'],
        block ? ['err', 'Giấy chứng nhận VSATTP đã hết hạn', 'Lỗi chặn. Cập nhật bản còn hạn trong Hồ sơ pháp lý.', 's11'] : ['ok', 'Giấy tờ pháp lý còn hạn', '4 giấy tờ, 1 sắp hết hạn (Công bố chất lượng).'],
        ['warn', '2 tiêu chí chưa có minh chứng', 'B5 Truy xuất nguồn gốc, C5 Tiềm năng xuất khẩu. Vẫn nộp được nhưng có thể bị yêu cầu bổ sung.', 's14'],
        ['ok', 'Đã tự chấm điểm thử', 'Ước lượng 78 điểm, 4 sao.'],
      ];
      const T = { ok: ['green', 'check'], warn: ['orange', 'triangle-alert'], err: ['red', 'x'] };
      const summary = O.card(`${O.dl([['Tên sản phẩm', 'Khô cá lóc đồng'], ['Nhóm sản phẩm', 'Thực phẩm'], ['Chủ thể', 'Cơ sở Mắm Bà Sáu'], ['Địa điểm sản xuất', 'Ấp Phú Lợi, Xã An Phú'], ['Công bố chất lượng', '15/2026/MBS, ngày 02/02/2026'], ['Ảnh sản phẩm', '3 ảnh']])}
        <hr class="divider" style="margin:18px 0"><h3 style="margin-bottom:12px">Minh chứng theo phần</h3><div class="stack s12">${D.parts.map((p) => { const ts = D.tieuchi.filter((t) => t.part === p.id); const n = ts.filter((t) => t.ev > 0).length; return `<div class="ct-part"><span>${p.name}</span><b class="num">${n} / ${ts.length} tiêu chí</b>${O.progress(n, ts.length, n < ts.length ? 'orange' : '')}</div>`; }).join('')}</div>`, { title: 'Tóm tắt hồ sơ', actions: O.btn('Sửa', { kind: 'ghost', size: 'sm', icon: 'pencil', go: 's13' }) });
      const check = `<section class="card raised stack ct-res"><h2>Kiểm tra trước khi nộp</h2>
        ${closed ? O.banner({ tone: 'red', icon: 'calendar-x', title: 'Đợt đánh giá 2026 đã đóng nhận hồ sơ', text: 'Hồ sơ được giữ nguyên dạng nháp. Bạn có thể chuyển sang đợt sau khi đợt mới mở.', actions: O.btn('Chuyển sang đợt 2027', { size: 'sm', attrs: 'data-toast="Đã đặt hồ sơ vào đợt 2027"' }) }) : `<div class="row between"><span class="small muted">Hạn nộp của đợt ${D.dot.hanXa}</span><div class="ct-cd"><div><b>05</b><span>ngày</span></div><div><b>14</b><span>giờ</span></div><div><b>26</b><span>phút</span></div></div></div>`}
        <div>${chk.map(([k, t, d, go]) => `<div class="ct-chk" style="--t:var(--c-${T[k][0]})"><span class="ci">${ic(T[k][1])}</span><div class="stack s8" style="gap:2px;flex:1;min-width:0"><b>${t}</b><span class="small muted">${d}</span>${go ? `<a href="#${go}" class="small strong">Đi tới sửa</a>` : ''}</div></div>`).join('')}</div>
        <label class="check"><input type="checkbox" id="s16-cf" ${closed ? 'disabled' : ''}><span>Tôi cam kết các thông tin và minh chứng trong hồ sơ là chính xác, trung thực và chịu trách nhiệm trước pháp luật.</span></label>
        <button class="btn primary lg" id="s16-submit" disabled>${ic('send')}<span>Nộp hồ sơ</span></button>
        ${block ? '<p class="small" style="color:var(--c-red)">Sửa lỗi chặn để có thể nộp.</p>' : ''}</section>`;
      return `${draftHead(3)}<div class="grid g-main ct-swap">${summary}${check}</div>`;
    },
    mount(root, { variant: v }) {
      const cf = root.querySelector('#s16-cf'), b = root.querySelector('#s16-submit');
      if (!cf) return;
      cf.addEventListener('change', () => { b.disabled = !cf.checked || v === 'block' || v === 'closed'; });
      b.addEventListener('click', () => O.confirm({ title: 'Nộp hồ sơ Khô cá lóc đồng?', icon: 'send', what: 'Sau khi nộp, hồ sơ được chốt phiên bản và gửi UBND xã. Muốn sửa phải chờ xã yêu cầu bổ sung.', notify: 'UBND Xã An Phú (cán bộ tiếp nhận) và bạn.', undo: 'Có thể rút hồ sơ trước khi xã bắt đầu xử lý.', confirmText: 'Nộp hồ sơ', onConfirm: () => O.go('s16', { variant: 'done' }) }));
    },
  });

  /* ================= S17 Chi tiết hồ sơ ================= */
  const STEXT = { danop: 'Hồ sơ của bạn đã được gửi tới UBND xã và đang chờ tiếp nhận.', hdxemxet: 'Hồ sơ của bạn đang được hội đồng tỉnh xem xét.', bosung: 'UBND xã cần bạn bổ sung một số minh chứng trước khi xét tiếp.' };
  O.screen('s17', {
    title: 'Chi tiết hồ sơ', code: 'S17', roles: ['chuthe'], device: 'Di động', crumbs: [['Hồ sơ của tôi', 's12']],
    variants: [['hd', 'Hội đồng đang xem xét'], ['danop', 'Vừa nộp, chờ xã']],
    render({ variant: v }) {
      const nop = v === 'danop';
      const h = nop ? { ma: 'HS-2026-0132', sp: 'Khô cá lóc đồng', st: 'danop', step: 1 } : { ma: 'HS-2026-0123', sp: 'Mắm cá linh khô', st: 'hdxemxet', step: 3 };
      const next = nop
        ? `<div class="ct-next"><span class="ni">${ic('landmark')}</span><div class="stack s8" style="flex:1;min-width:0"><b>Bước tiếp theo: UBND Xã An Phú tiếp nhận</b><span class="small muted">Người xử lý: Ngô Bảo Ngọc, cán bộ văn phòng. Dự kiến trước 25/10/2026.</span><div class="row s8">${O.btn('Rút hồ sơ', { kind: 'danger-ghost', size: 'sm', icon: 'undo-2', id: 's17-rut' })}</div></div></div>`
        : `<div class="ct-next"><span class="ni">${ic('users')}</span><div class="stack s8" style="flex:1;min-width:0"><b>Bước tiếp theo: Hội đồng tỉnh họp chốt điểm</b><span class="small muted">Hồ sơ đang ở Hội đồng đánh giá cấp tỉnh. Dự kiến có kết quả trước ${D.dot.hanTinh}. Bạn không cần làm gì thêm lúc này.</span></div></div>`;
      const overview = `<div class="stack">${next}${O.card(O.dl([['Mã hồ sơ', h.ma], ['Tên sản phẩm', h.sp], ['Nhóm sản phẩm', 'Thực phẩm'], ['Đợt', D.dot.ten], ['Chủ thể', 'Cơ sở Mắm Bà Sáu'], ['Xã/phường', 'Xã An Phú'], ['Ngày nộp', '02/04/2026 09:45'], ['Phiên bản hồ sơ', 'Phiên bản 2 (sau bổ sung)']]), { title: 'Thông tin hồ sơ', sub: 'Chỉ đọc. Hồ sơ đã nộp không sửa trực tiếp được.' })}</div>`;
      const ev = O.card(`<div class="stack s12">${D.parts.map((p) => `<div class="stack s8"><h3>${p.name}</h3>${D.files.filter((f) => f.crit.startsWith(p.id)).map((f) => O.file(f)).join('') || '<p class="small faint">Xem đầy đủ trong từng tiêu chí.</p>'}</div>`).join('')}</div>`);
      const hist = O.card(O.timeline([
        ['users', 'purple', 'Hội đồng tỉnh bắt đầu xem xét', '12/10/2026 08:30 · Thư ký Trần Thị B'],
        ['file-check-2', 'purple', 'Tổ tư vấn phát hành báo cáo thẩm định', '10/10/2026 16:10 · Hoàng Thị E'],
        ['arrow-up-right', 'blue', 'Sở NN&MT tiếp nhận hồ sơ', '05/05/2026 10:02 · Phan Thu Hà'],
        ['send', 'blue', 'UBND xã gửi hồ sơ lên tỉnh', '18/04/2026 15:20 · Lý do: đạt đánh giá sơ bộ'],
        ['file-pen-line', 'orange', 'Bạn nộp lại sau bổ sung', '14/04/2026 20:11 · Phiên bản 2'],
        ['file-warning', 'orange', 'UBND xã yêu cầu bổ sung 2 mục', '08/04/2026 09:00 · Ngô Bảo Ngọc'],
        ['send', 'green', 'Bạn nộp hồ sơ', '02/04/2026 09:45 · Phiên bản 1'],
      ]));
      const req = O.card(`<div class="list">${[['Bổ sung hợp đồng thu mua cá linh', 'Đã trả lời 14/04/2026'], ['Ảnh chụp khu phơi sạch', 'Đã trả lời 14/04/2026']].map(([t, s]) => `<div class="li"><span class="nav-ico" style="background:var(--surface-3);color:var(--c-green);margin:0">${ic('circle-check')}</span><div class="grow"><b>${t}</b><div class="small muted">${s}</div></div>${O.tag('Đã đóng', 'gray')}</div>`).join('')}</div>`, { title: 'Yêu cầu bổ sung', sub: 'Từ UBND Xã An Phú, ngày 08/04/2026' });
      const kq = O.card(O.empty({ icon: 'hourglass', title: 'Chưa có kết quả', text: 'Kết quả sẽ hiển thị tại đây sau khi hội đồng chốt điểm và Sở công bố.' }));
      return `${O.pageHead({ title: h.sp, chips: `${O.chip(h.st)}<span class="tag">${h.ma}</span><span class="tag">${D.dot.ten}</span>`, sub: STEXT[h.st] })}
        ${O.card(O.stepper(h.step, nop ? ['14/10/2026', '', '', '', ''] : undefined), { cls: 'tight' })}
        ${O.tabs([['tq', 'Tổng quan'], ['mc', 'Minh chứng'], ['ls', 'Lịch sử'], ['bs', 'Yêu cầu bổ sung', 2], ['kq', 'Kết quả']], { tq: overview, mc: ev, ls: hist, bs: req, kq }, { style: 'line' })}`;
    },
    mount(root) {
      root.querySelector('#s17-rut')?.addEventListener('click', () => O.confirm({ title: 'Rút hồ sơ Khô cá lóc đồng?', kind: 'danger', icon: 'undo-2', what: 'Hồ sơ chuyển sang trạng thái "Đã rút" và không được xét trong đợt này.', notify: 'UBND Xã An Phú.', undo: 'Không. Muốn tham gia lại phải tạo hồ sơ mới.', extra: `<div class="field"><label for="rut-ly">Lý do rút hồ sơ<span class="req">*</span></label><textarea class="textarea" id="rut-ly" placeholder="Ví dụ: cần hoàn thiện bao bì trước khi nộp"></textarea></div>`, confirmText: 'Rút hồ sơ', onConfirm: () => O.toast('Đã rút hồ sơ HS-2026-0132') }));
    },
  });

  /* ================= S18 Yêu cầu bổ sung và nộp lại ================= */
  const REQ = [
    { t: 'Bổ sung hợp đồng thu mua đu đủ với nông hộ', link: 'Tiêu chí A2: Nguồn gốc nguyên liệu', ans: 'Đã tải hợp đồng với 6 hộ trồng đu đủ tại ấp Phú Lợi.', file: 'Hop-dong-thu-mua-du-du.pdf' },
    { t: 'Ảnh chụp khu vực sơ chế có mái che', link: 'Tiêu chí A5: Bảo vệ môi trường', ans: 'Ảnh khu sơ chế sau khi làm mái tôn và nền xi măng.', file: 'Khu-so-che.jpg' },
    { t: 'Giấy chứng nhận VSATTP còn hiệu lực', link: 'Giấy tờ pháp lý: Giấy chứng nhận VSATTP', ans: '', file: '' },
    { t: 'Phiếu kiểm nghiệm chỉ tiêu vi sinh mới nhất', link: 'Tiêu chí C2: Chỉ tiêu an toàn thực phẩm', ans: '', file: '' },
  ];
  O.screen('s18', {
    title: 'Yêu cầu bổ sung', code: 'S18', roles: ['chuthe'], device: 'Di động', crumbs: [['Hồ sơ của tôi', 's12'], ['HS-2026-0135', 's17']],
    variants: [['default', 'Đang trả lời'], ['late', 'Quá hạn'], ['sent', 'Đã nộp lại']],
    render({ variant: v }) {
      const sent = v === 'sent';

  function hl(text, q) {
    if (!q) return esc(text);
    const st = strip(text), sq = strip(q).trim(); const i = st.indexOf(sq);
    if (i < 0 || !sq) return esc(text);
    const chars = [...String(text)];
    return esc(chars.slice(0, i).join('')) + '<mark>' + esc(chars.slice(i, i + sq.length).join('')) + '</mark>' + esc(chars.slice(i + sq.length).join(''));
  }

          <div class="field"><label for="rg-mail">Email<span class="req">*</span></label><div class="input-icon">${ic('mail')}<input class="input" id="rg-mail" type="email" value="sau.nguyen.mam@gmail.com"></div><span class="hint">Dùng để đăng nhập và nhận thông báo</span></div></div>
          ${pwField('rg-pw', 'Mật khẩu', { meter: true, auto: 'new-password', ph: 'Tối thiểu 8 ký tự' })}

          <div class="row">${O.btn('Bật xác thực hai lớp', { kind: 'primary', icon: 'shield-check', id: 'tfa-on' })}</div>
        </div>`;
      const tfaCard = O.card(tfaOn
        ? `<div class="stack"><div class="row">${O.tag('Đã bật', 'green', 'shield-check')}<span class="small muted">Từ 12/03/2026 · Ứng dụng Microsoft Authenticator</span></div><p class="small muted">Mỗi lần đăng nhập, bạn nhập thêm mã 6 số trong ứng dụng. Còn 6 mã dự phòng chưa dùng.</p><div class="row s8">${O.btn('Xem mã dự phòng', { size: 'sm', icon: 'key-round', id: 'show-codes' })}${O.btn('Đổi thiết bị xác thực', { size: 'sm', icon: 'smartphone', attrs: 'data-variant-go="setup"' })}</div></div>`

      <div class="grid g-4">${O.stat({ label: 'Được giao', value: 6, icon: 'inbox', tone: 'green' })}${O.stat({ label: 'Chưa bắt đầu', value: 2, icon: 'circle-dashed', tone: 'gray', sub: '1 hồ sơ quá hạn' })}${O.stat({ label: 'Đang thẩm định', value: 2, icon: 'search-check', tone: 'blue' })}${O.stat({ label: 'Đã phát hành', value: 2, icon: 'file-check-2', tone: 'purple' })}</div>

  /* ======= S51 Thẩm định và chấm điểm đề xuất ======= */
  let s51 = null;

    s51 = {};

    ['C4', 'C5'].forEach((c) => { s51[c].v = ''; s51[c].can = ''; });
    s51.B5.can = ''; s51.B5.flags.add('thieu'); s51.C5.flags.add('xacminh'); s51.A5.flags.add('luuy');

  const s51Crit = (t) => {

    return `<div class="crit ${open ? '' : 'closed'}" data-code="${t.code}">

      <div class="crit-body">

        <div class="stack s8" style="gap:6px"><span class="label">Viện dẫn minh chứng</span><div class="row s8" data-refs>${s.refs.map(O.fileChip).join('')}<button type="button" class="btn sm ghost" data-addref>${ic('plus')}<span>Thêm</span></button></div></div>
        <div class="row s8">${FLAGS.map(([k, l, tone, i]) => `<button type="button" class="flagbtn ${s.flags.has(k) ? 'on' : ''}" style="--t:var(--c-${tone})" data-flag="${k}" aria-pressed="${s.flags.has(k)}">${ic(i)}${l}</button>`).join('')}</div>

  };
  O.screen('s51', {
    title: 'Thẩm định và chấm điểm đề xuất', navTitle: 'Thẩm định hồ sơ', code: 'S51', roles: ['ttv'], device: 'Máy tính', crumbs: [['Hàng đợi thẩm định', 's50'], ['HS-2026-0123', 's50']],

      <div class="kbd-hint"><span>${ic('keyboard')} Phím tắt:</span><span><kbd>Tab</kbd> ô điểm kế tiếp</span><span><kbd>↑</kbd><kbd>↓</kbd> tăng giảm điểm</span><span><kbd>Alt</kbd>+<kbd>M</kbd> mở minh chứng của tiêu chí đang nhập</span></div>

          p.querySelectorAll('[data-pick]').forEach((o) => o.addEventListener('click', () => { s.refs.push(o.dataset.pick); const wrap = c.querySelector('[data-refs]'); const add = wrap.querySelector('[data-addref]'); add.insertAdjacentHTML('beforebegin', O.fileChip(o.dataset.pick)); const nc = add.previousElementSibling; nc.addEventListener('click', (ev) => { ev.stopPropagation(); O.previewFile(nc.dataset.preview); }); O.closePop(); dirty(); }));
        });

      root.querySelector('[data-savebtn]').addEventListener('click', () => O.toast('Đã lưu nháp phiếu thẩm định'));

  /* ======= S52 Soạn và phát hành báo cáo Tổ tư vấn ======= */
  O.screen('s52', {
    title: 'Soạn và phát hành báo cáo Tổ tư vấn', navTitle: 'Báo cáo Tổ tư vấn', code: 'S52', roles: ['ttv'], device: 'Máy tính', crumbs: [['Hàng đợi thẩm định', 's50'], ['HS-2026-0123', 's51']],
    variants: [['draft', 'Nháp'], ['published', 'Đã phát hành'], ['confirmed', 'Thành viên đã xác nhận phiếu']],
    render({ variant }) {

      return `${head}${variant === 'dachot' ? O.lockband('Đã chốt điểm bởi Nguyễn Văn A (chủ tịch hội đồng), 18/10/2026 15:40', 'Mọi ô chỉ đọc. Kết quả chính thức: 4 sao.') : O.banner({ tone: 'green', icon: 'users', title: 'Đủ 4 / 4 phiếu xác nhận', text: 'Bảng dùng để họp thống nhất. Thư ký và chủ tịch hội đồng chốt điểm trong cuộc họp.' })}

  function bindS23(root) {

  O.screen('s35', {
    title: 'Thống kê và xuất báo cáo', navTitle: 'Thống kê', code: 'S35', roles: ['so', 'xa'], device: 'Máy tính', crumbs: [['Trang chủ', 's30']],
    variants: [['default', 'Mặc định'], ['nodata', 'Chưa đủ dữ liệu']],
    render(ctx) {
      const isXa = ctx.role === 'xa';
      const fb = `<div class="filterbar"><select class="select" aria-label="Đợt"><option>${D.dot.ten}</option><option>Đợt đánh giá 2025</option></select><select class="select" aria-label="Nhóm sản phẩm"><option>Mọi nhóm sản phẩm</option>${D.nhom.map((n) => `<option>${n}</option>`).join('')}</select><select class="select" aria-label="Đơn vị" ${isXa ? 'disabled' : ''}>${isXa ? '<option>Xã An Phú</option>' : `<option>Mọi xã/phường</option>${D.xa.map((x) => `<option>${x}</option>`).join('')}`}</select><select class="select" aria-label="Hạng"><option>Mọi hạng</option><option>3 sao</option><option>4 sao</option><option>Đề nghị 5 sao</option></select><span class="spacer"></span>${O.btn('Excel', { icon: 'file-spreadsheet', size: 'sm', attrs: 'data-toast="Đang xuất báo cáo Excel"' })}${O.btn('PDF', { icon: 'file-down', size: 'sm', attrs: 'data-toast="Đang xuất báo cáo PDF"' })}</div>`;
      const head = O.pageHead({ title: 'Thống kê và báo cáo', sub: isXa ? 'Phạm vi: Xã An Phú. Cán bộ xã chỉ thấy số liệu của xã mình.' : 'Phạm vi: toàn tỉnh', chips: O.tag('Đợt 2', 'gray') });
      if (ctx.variant === 'nodata') return head + fb + O.card(O.empty({ icon: 'chart-no-axes-column', title: 'Chưa đủ dữ liệu để thống kê', text: 'Bộ lọc hiện tại chỉ có 2 hồ sơ. Thử chọn đợt khác hoặc bỏ bớt điều kiện lọc.', action: O.btn('Bỏ bộ lọc', { kind: 'soft', attrs: 'data-variant="default"' }) }));
      const k = isXa ? [15, '73%', 6, 3, 0, '19,2'] : [128, '68%', 21, 12, 6, '21,5'];
      const kpi = `<div class="grid g-4" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${O.stat({ label: 'Tổng hồ sơ', value: k[0], icon: 'folder-open', tone: 'blue' })}${O.stat({ label: 'Tỷ lệ đạt', value: k[1], sub: 'Trên hồ sơ đã chốt', icon: 'percent', tone: 'green' })}${O.stat({ label: 'Hồ sơ 3 sao', value: k[2], icon: 'star', tone: 'amber' })}${O.stat({ label: 'Hồ sơ 4 sao', value: k[3], icon: 'star', tone: 'amber' })}${O.stat({ label: 'Đề nghị 5 sao', value: k[4], icon: 'sparkles', tone: 'purple' })}${O.stat({ label: 'Xử lý trung bình', value: k[5], sub: 'ngày', icon: 'timer', tone: 'teal' })}</div>`;
      const byStatus = O.card(O.bars([['Nộp', 7], ['Sơ bộ', 13], ['Thẩm định', 23], ['Chấm', 31], ['Đã chốt', 42], ['Công nhận', 33]].map(([l, v]) => ({ l, v, tip: [['Hồ sơ', v]] })), { max: 50, height: 220, hl: 4 }), { title: 'Hồ sơ theo trạng thái' });
      const byGroup = O.card(O.hbars([{ l: 'Thực phẩm', v: 58 }, { l: 'Đồ uống', v: 24 }, { l: 'Dược liệu', v: 17 }, { l: 'Thủ công mỹ nghệ', v: 15 }, { l: 'Cây cảnh', v: 8 }, { l: 'Du lịch cộng đồng', v: 6 }], 60), { title: 'Theo nhóm sản phẩm' });
      const byXa = O.card(`${O.hbars([{ l: 'Xã An Phú', v: 15, parts: [[6, 'green'], [3, 'amber'], [6, 'gray']] }, { l: 'Phường Tân Hòa', v: 12, parts: [[4, 'green'], [2, 'amber'], [6, 'gray']] }, { l: 'Xã Bình Thạnh', v: 11, parts: [[5, 'green'], [1, 'amber'], [5, 'gray']] }, { l: 'Xã Long Điền', v: 9, parts: [[3, 'green'], [2, 'amber'], [4, 'gray']] }, { l: 'Xã Phú Hữu', v: 8, parts: [[2, 'green'], [3, 'amber'], [3, 'gray']] }], 16)}<div class="legend" style="margin-top:14px"><span><i style="background:var(--c-green)"></i>3 sao</span><span><i style="background:var(--c-amber)"></i>4 sao trở lên</span><span><i style="background:var(--c-gray)"></i>Đang xử lý, chưa đạt</span></div>`, { title: 'Theo xã/phường' });
      const dist = (t, arr) => `<div class="dist" style="--t:var(--c-${t})">${arr.map((v) => `<i style="height:${v}%" title="${v} hồ sơ"></i>`).join('')}</div>`;
      const abc = O.card(`<div class="abc">${[['A', 40, 'green', [8, 15, 30, 62, 88, 54, 20], '29,4'], ['B', 25, 'blue', [12, 26, 48, 80, 52, 18], '17,1'], ['C', 35, 'purple', [6, 18, 40, 70, 90, 46, 14], '25,8']].map(([p, m, t, a, avg]) => `<div class="col"><b>Phần ${p}</b><span class="tiny muted">Tối đa ${m} · trung bình ${avg}</span>${dist(t, a)}<div class="row between tiny faint"><span>0</span><span>${m}</span></div></div>`).join('')}</div>`, { title: 'Phân bố điểm Phần A, B, C', sub: 'Số hồ sơ theo khoảng điểm, hồ sơ đã chốt' });
      const tbl = `<section class="card flush"><div class="card-head" style="padding:18px 18px 0"><h2>Bảng chi tiết</h2></div>${O.table({ total: 128, cols: [{ k: 'sp', l: 'Sản phẩm', sort: true }, { k: 'xa', l: 'Xã/phường', sort: true }, { k: 'nhom', l: 'Nhóm', sort: true }, { k: 'diem', l: 'Điểm', cls: 'r', sort: true }, { k: 'sao', l: 'Hạng', sort: true }, { k: 'st', l: 'Trạng thái' }], rows: D.hoso.filter((h) => h.diem != null && (!isXa || h.xa === 'Xã An Phú')), cell: (h, c) => c.k === 'sp' ? O.prodCell(h) : c.k === 'diem' ? `<b>${h.diem}</b>` : c.k === 'sao' ? (h.sao ? O.stars(h.sao) : '<span class="faint small">Chưa đạt</span>') : c.k === 'st' ? O.chip(h.st) : `<span class="small">${esc(h[c.k])}</span>`, card: (h) => `<div class="mcard">${O.prodCell(h)}<div class="row s8">${h.sao ? O.stars(h.sao) : ''}<b>${h.diem} điểm</b></div></div>` })}</section>`;
      return head + fb + kpi + `<div class="grid g-2">${byStatus}${byGroup}${byXa}${abc}</div>` + tbl;
    },
  });
})();

</script>
<script>OCOP.start();</script>
